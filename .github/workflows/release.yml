name: Create Direct-IP Release

on:
  workflow_dispatch:
    inputs:
      direct-ip-version:
        description: "Direct-IP release version (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  determine-version:
    name: Compute combined release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      rustdesk-version: ${{ steps.compute.outputs.rustdesk-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute tag from upstream RustDesk version + Direct-IP suffix
        id: compute
        shell: bash
        run: |
          RUSTDESK_VERSION=$(sed -n 's/^[[:space:]]*VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' .github/workflows/flutter-build.yml | head -n 1)

          if [ -z "$RUSTDESK_VERSION" ]; then
            echo "Could not determine RustDesk VERSION from flutter-build.yml"
            exit 1
          fi

          TAG="v${RUSTDESK_VERSION}-direct-ip.${{ inputs.direct-ip-version }}"

          echo "rustdesk-version=$RUSTDESK_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RustDesk baseline: $RUSTDESK_VERSION"
          echo "Combined release tag: $TAG"

  build:
    name: Build RustDesk Direct-IP ${{ inputs.direct-ip-version }}
    needs: determine-version
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-release: true
      upload-tag: ${{ needs.determine-version.outputs.tag }}

  finalize-release:
    name: Finalize GitHub Release
    needs: [determine-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## RustDesk Direct-IP v${{ inputs.direct-ip-version }}

          Direct-IP release version: **${{ inputs.direct-ip-version }}**

          Based on RustDesk: **${{ needs.determine-version.outputs.rustdesk-version }}**

          ### Build information

          - RustDesk baseline: \`${{ needs.determine-version.outputs.rustdesk-version }}\`
          - Direct-IP version: \`${{ inputs.direct-ip-version }}\`
          - Release tag: \`${{ needs.determine-version.outputs.tag }}\`
          - Windows builds are unsigned.
          - Android builds are unsigned unless Android signing credentials are configured.

          This release was built automatically by the repository's
          \`flutter-build.yml\` workflow.
          EOF

      - name: Finalize release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.determine-version.outputs.tag }}"

          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "RustDesk Direct-IP v${{ inputs.direct-ip-version }}" \
            --notes-file release-notes.md \
            --prerelease=false
