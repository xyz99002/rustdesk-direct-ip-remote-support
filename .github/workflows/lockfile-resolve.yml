name: Resolve Cargo.lock

# Fork helper: let cargo re-resolve Cargo.lock after a hand edit (no local toolchain) and
# print the diff, without building anything. Dispatch manually from the Actions tab, read
# the "Lock diff" step or download the Cargo.lock artifact. Changes under .github/ are in
# the CI workflows' paths-ignore, so neither this file nor its runs start a build.
on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.75
      - name: Locked check (expected to fail)
        run: cargo metadata --format-version 1 --locked > /dev/null || echo "LOCKED-CHECK-FAILED"
      - name: Re-resolve
        run: cargo metadata --format-version 1 > /dev/null
      - name: Lock diff
        run: |
          echo "=====BEGIN LOCK DIFF====="
          git --no-pager diff --no-color Cargo.lock
          echo "=====END LOCK DIFF====="
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
