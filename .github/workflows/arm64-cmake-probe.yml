name: Windows CMake generator probe

# Fork helper (manual only, changes under .github/ start no CI). Two jobs:
#  - `verify`: builds a tiny crate that depends on turbojpeg (the library libs/scrap uses for
#    MJPEG camera frames) on every Windows configuration the real workflows build, using the
#    shared .github/actions/select-cmake-generator action - i.e. proves the "whatever Visual
#    Studio the runner has" logic on windows-11-arm (Visual Studio 2026 only), windows-2022 x64
#    and windows-2022 i686 (the 32-bit Sciter job). Dispatch it after runner-image changes or
#    edits to that action.
#  - `facts`: prints the runner's Visual Studio / CMake facts (what showed that the ARM64
#    image has no Visual Studio 2022, 2026-10-17).
on:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }} ${{ matrix.target || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: ''
          - os: windows-2022
            target: ''
          - os: windows-2022
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
        with:
          targets: ${{ matrix.target }}
      - name: Select CMake generator
        uses: ./.github/actions/select-cmake-generator
      - name: Build turbojpeg-sys and decode garbage
        shell: pwsh
        run: |
          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"
          $t = Join-Path $env:RUNNER_TEMP "tj_probe"
          New-Item -ItemType Directory -Force "$t\src" | Out-Null
          Set-Content "$t\Cargo.toml" "[package]`nname = `"tj_probe`"`nversion = `"0.1.0`"`nedition = `"2021`"`n[dependencies]`nturbojpeg = { version = `"1.5`", default-features = false, features = [`"cmake`"] }`n"
          Set-Content "$t\src\main.rs" "fn main() { println!(`"garbage_is_error={:?}`", turbojpeg::decompress(&[0u8; 8], turbojpeg::PixelFormat::RGBA).is_err()); }"
          Set-Location $t
          $tgt = "${{ matrix.target }}"
          if ($tgt) { cargo build --release --target $tgt; $exe = "target\$tgt\release\tj_probe.exe" }
          else { cargo build --release; $exe = "target\release\tj_probe.exe" }
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }
          $out = & ".\$exe"
          Write-Host $out
          if ($out -notmatch 'garbage_is_error=true') { throw "unexpected output: $out" }
          Write-Host "===== RESULT OK ${{ matrix.os }} ${{ matrix.target }}"

  facts:
    runs-on: windows-11-arm
    steps:
      - name: Facts
        shell: pwsh
        run: |
          Write-Host "== cmake"; cmake --version
          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vw -all -prerelease -products * -property displayName
          & $vw -all -prerelease -products * -property installationPath
          Write-Host "== generators offered by cmake (star = default)"
          cmake --help | Select-String "Visual Studio|Ninja"
