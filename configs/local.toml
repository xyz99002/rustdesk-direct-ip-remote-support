# Example config.toml — Local role
#
# THIS FILE BECOMES config.toml — this fork's own config file, parsed directly by
# src/fork_config.rs (never by upstream's Config::get_option/Config2). It is deliberately a
# distinct file/name from upstream's own RustDesk2.toml, kept next to the executable rather than
# the OS-standard per-user config directory (a portable-deployment design decision). Every
# option in the [options] table below is applied by fork_config.rs on every startup — the
# this module's own schema keys, everything else mirrored verbatim into
# upstream's real option storage. See docs/CONFIG_REFERENCE.md.
#
# "local" means this instance may only INITIATE outbound direct-IP connections; it will never
# accept an inbound session. Typical use: the machine an operator sits at to reach out to a
# remote host. The connection page shows a hostname/IP field, Support/Desktop buttons (see
# support-enabled / desktop-share-enabled below) and an always-present "Transfer file" button
# (no local gate; the remote's enable-file-transfer permission decides).
#
# File location: next to rustdesk.exe (or the rustdesk binary on Linux/macOS) — copied here
# from this sample by the first-run setup dialog, or hand-edited/pre-seeded directly.
#
# All the schema fields below are REQUIRED (except show-setup-ui) — src/fork_config.rs
# has no implicit defaults for the others. See docs/CONFIG_REFERENCE.md for the full reference.

rendezvous_server = ""
nat_type = 0
serial = 0
unlock_pin = ""
trusted_devices = ""

[options]
# --- Direct-IP fork configuration (src/fork_config.rs) ---
config-version = "1"
role = "local"

# support-enabled: shows/hides the "Support" button, which opens a VIEW_CAMERA session
#   (a Voice Call rides on it too) to the host/IP typed above. Also gates the REMOTE side's
#   acceptance of that same request, via the existing upstream "enable-camera" permission — fully
#   enforced remotely (see docs/CONFIG_FEATURE_VALIDATION.md Section 1).
# desktop-share-enabled: shows/hides the "Desktop" button, a plain full desktop-share
#   connect. LOCAL UI HINT ONLY — no remote-side enforcement exists yet (see
#   docs/CONFIG_FEATURE_VALIDATION.md Section 2).
# At least one of these two must be true, or the connect panel would have nothing on it.
support-enabled = "Y"
desktop-share-enabled = "Y"

# Optional — defaults to "Y" (shown) if omitted. Set to "N" to hide the Settings entry point
# entirely (e.g. for an unattended kiosk-style operator machine).
show-setup-ui = "Y"

# voice-call-enabled: Optional — defaults to "Y" if omitted. "N" removes the "Voice call"
#   entry from the Desktop/Support toolbars and stops the Support button's automatic call on
#   THIS machine. The remote decides for itself with its own copy of this key (it rejects the
#   request outright and tells the caller why). Note: upstream's "enable-audio" permission is
#   NOT a voice-call switch - it only controls whether this side hears the remote's audio.
voice-call-enabled = "Y"

# auth-mode: how an INBOUND session on THIS machine would be approved, and whether the
#   local temporary password is shown at all. (For a pure "local" role this mostly matters if you
#   ever flip role to "remote" later using the same file as a starting point.)
#   "ask"              -> Approval is a manual click in the connection-manager popup; no password
#                          is checked at all, so the temporary password is NOT generated/shown.
#   "password"         -> Approval requires the temporary password; it IS shown in Settings/the
#                          tray so it can be read out to the connecting operator.
#   "ask_and_password" -> Either a manual click OR the temporary password is accepted; the
#                          temporary password IS shown (upstream's own default behavior).
auth-mode = "ask_and_password"

# listen-port is the REAL, authoritative port this instance listens on for inbound direct-IP
# connections — fork_config.rs::apply() forces it into upstream's own "direct-access-port"
# option every startup (see the "Settings > Safety > Security" section below: do NOT also set
# direct-access-port there, it would just be overwritten back to this value).
# listen-address is parsed/validated but NOT YET wired to any behavior — the underlying listener
# has no configurable bind address yet (see docs/CONFIG_REFERENCE.md).
listen-address = "0.0.0.0"
listen-port = "21118"
video-quality = "medium"
audio-quality = "medium"
log-level = "info"

# --- Every upstream option shown on the Settings screen (Settings > Safety), so all of it can be
#     set here up front instead of clicked through by hand. Each comment names the exact Settings
#     screen control it corresponds to. Keys/behavior verified against
#     flutter/lib/desktop/pages/desktop_setting_page.dart and flutter/lib/consts.dart. Anything
#     not listed here can still be added the same way — see
#     docs/UPSTREAM_CONFIG_REFERENCE.md for the full ~130-key catalog. ---

# Settings > Safety > Permissions
access-mode = ""                        # "Permissions" combo box: "" = Custom (use the individual
                                         #   checkboxes below), "full" = Full Access, "view" = Screen Share.
enable-keyboard = "Y"                   # "Enable keyboard/mouse"
enable-remote-printer = "Y"             # "Enable remote printer" (Windows only)
enable-clipboard = "Y"                  # "Enable clipboard"
enable-file-transfer = "Y"              # "Enable file transfer"
enable-audio = "Y"                      # "Enable audio"
# enable-camera: see support-enabled above — do not set here, it is overwritten.
enable-terminal = "N"                   # "Enable terminal"
enable-tunnel = "N"                     # "Enable TCP tunneling"
enable-remote-restart = "N"             # "Enable remote restart"
enable-record-session = "N"             # "Enable recording session" (records when connecting out).
enable-block-input = "N"                # "Enable blocking user input" (Windows only)
enable-privacy-mode = "N"               # "Enable privacy mode" (only shown if the platform supports it)
allow-remote-config-modification = "N"  # "Enable remote configuration modification"

# Settings > Safety > Password (approve-mode/verification-method come from auth-mode
# above and must not be set directly here — these two are independent of that mode):
temporary-password-length = "6"         # "One-time password length": "6", "8", or "10"
allow-numeric-one-time-password = "N"   # "Numeric one-time password"

# Settings > Safety > Security
# enable-lan-discovery: forced "N" unconditionally by this fork (ADR-0003) — do not set here.
# direct-server / direct-access-port: this fork has no rendezvous/relay accept path at all
#   (ADR-0003), so "Enable direct IP access" must always be on, not a user choice — fork_config.rs
#   forces direct-server = "Y" unconditionally and direct-access-port from listen-port above (do
#   not set either directly here, they would just be overwritten; the Settings UI toggle/port
#   field are greyed out for the same reason, via ui_interface::is_option_fixed()).
whitelist = ""                          # Comma-separated CIDR allow-list, e.g. "192.168.1.0/24"
allow-auto-disconnect = "N"             # "Automatically disconnect on idle" checkbox
auto-disconnect-timeout = "10"          # "Timeout in minutes" shown when the above is on
keep-awake-during-incoming-sessions = "Y"  # Keep this machine awake while a session is active
allow-only-conn-window-open = "N"       # Only allow control while the connection window is open
                                         #   (installed builds only)

# Settings > Safety > Recording (outgoing is the local-role-relevant half; incoming is hidden
# entirely by upstream's own UI when role is outgoing-only, so it is omitted here)
allow-auto-record-outgoing = "N"        # "Automatically record outgoing sessions"
# video-save-directory = ""             # Uncomment to override the default recordings folder.

# --- Resulting upstream options (written by fork_config.rs::apply() at every startup;
#     shown here for reference only — do not hand-edit these, they will be overwritten) ---
# approve-mode = ""                  # <- from auth-mode (empty = upstream's Both default)
# verification-method = ""           # <- from auth-mode (empty = upstream's default)
# enable-camera = "Y"                # <- from support-enabled
# enable-lan-discovery = "N"         # <- unconditional, ADR-0003
# direct-server = "Y"                # <- unconditional, ADR-0003 (see Security section above)
# direct-access-port = "21118"       # <- from listen-port above
