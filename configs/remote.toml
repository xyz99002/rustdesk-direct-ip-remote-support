# Example RustDesk2.toml — Remote role
#
# THIS FILE IS RustDesk2.toml — the ONE config file upstream RustDesk already uses.
# (2026-09-02: fork_config.toml was retired; direct-ip-* fork options now live in this same
# file's [options] table instead of a second file.)
#
# "remote" means this instance may only ACCEPT inbound direct-IP connections; it will never
# initiate an outbound session. Typical use: the machine being supported or shared.
#
# File location: same as local.toml — see docs/UPSTREAM_CONFIG_REFERENCE.md Section 1.

rendezvous_server = ""
nat_type = 0
serial = 0
unlock_pin = ""
trusted_devices = ""

[options]
# --- Direct-IP fork configuration (src/fork_config.rs) ---
direct-ip-config-version = "1"
direct-ip-role = "remote"

# direct-ip-support-enabled: gates acceptance of VIEW_CAMERA (and the Voice Call that rides on
#   it) at the protocol level via the existing upstream "enable-camera" permission — fully
#   enforced remotely (see docs/CONFIG_FEATURE_VALIDATION.md Section 1).
# direct-ip-desktop-share-enabled: LOCAL UI HINT ONLY on this host — no remote-side enforcement
#   exists yet (see docs/CONFIG_FEATURE_VALIDATION.md Section 2).
direct-ip-support-enabled = "Y"
direct-ip-desktop-share-enabled = "Y"

# Optional — set to "N" to hide the Settings entry point entirely on a locked-down remote host.
direct-ip-show-setup-ui = "Y"

# Parsed and validated, but NOT YET WIRED to any behavior.
direct-ip-listen-address = "0.0.0.0"
direct-ip-listen-port = "21118"
direct-ip-video-quality = "medium"
direct-ip-audio-quality = "medium"
direct-ip-log-level = "info"
direct-ip-auth-mode = "password"

# --- A curated set of relevant upstream options for a locked-down remote host (see
#     docs/UPSTREAM_CONFIG_REFERENCE.md Section 4 for the full ~130-key catalog) ---
whitelist = ""                # Comma-separated CIDR allow-list, e.g. "192.168.1.0/24"
enable-keyboard = "Y"
enable-clipboard = "Y"
enable-file-transfer = "Y"
enable-audio = "Y"
enable-terminal = "N"
enable-block-input = "N"

# --- Resulting upstream options (written by fork_config.rs::apply() at every startup;
#     shown here for reference only — do not hand-edit these three, they will be overwritten) ---
# approve-mode = "password"         # <- from direct-ip-auth-mode
# enable-camera = "Y"               # <- from direct-ip-support-enabled
# enable-lan-discovery = "N"        # <- unconditional, ADR-0003
