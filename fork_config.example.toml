# Sample configuration for the RustDesk direct-IP fork.
#
# Copy this file to "fork_config.toml" next to the application executable
# (or, for local development builds, into the repository root as "./fork_config.toml").
#
# If this file is absent, the application runs with pure upstream RustDesk behavior:
# no role restriction, upstream's own default authentication mode.
# If this file is present but invalid, the same fallback applies, with the specific
# problem logged as an error.
#
# See docs/architecture.md for the full schema and the mapping to upstream RustDesk
# mechanisms, and docs/FORK_PROFILE_SPEC.md for the product-level behavior this
# configures.
#
# NOTE ON ORDERING: [authentication] must stay the LAST section in this file. In TOML,
# every "key = value" line after a "[table]" header belongs to that table, not to the
# top level — putting any of the keys below after [authentication] would silently nest
# them under authentication.* instead of the top level.

# Schema version. Only 1 is supported today.
version = 1

# "local"  -> this instance may only initiate outbound direct-IP connections;
#             it will never accept an inbound session.
# "remote" -> this instance may only accept inbound direct-IP connections;
#             it will never initiate an outbound session.
role = "local"

# Shows/hides the Support button. Support always opens a VIEW_CAMERA session plus a Voice
# Call on it; also opens a DEFAULT_CONN session when desktop_share_enabled is true below.
# On the remote side, this also gates whether VIEW_CAMERA (and therefore Voice Call)
# connections are accepted at all, via the existing upstream "enable-camera" permission.
support_enabled = true

# Shows/hides the Desktop button, which opens a plain DEFAULT_CONN session only (no camera,
# no voice call) — standard upstream RustDesk behavior. Local UI only; there is no existing
# upstream permission to reject DEFAULT_CONN remotely (see docs/FORK_PROFILE_SPEC.md).
desktop_share_enabled = true

# At least one of support_enabled / desktop_share_enabled must be true.

# --- The keys below are validated but not yet behaviorally active. ---
# --- They are reserved for the Direct-IP transport and minimal-UI phases. ---

listen_address = "0.0.0.0"
listen_port = 21118

# "low", "medium", or "high"
video_quality = "medium"
audio_quality = "medium"

# "error", "warn", "info", "debug", or "trace"
log_level = "info"

[authentication]
# "ask"              -> remote user manually approves each session (upstream approve-mode "click")
# "password"         -> a valid password is required (upstream approve-mode "password")
# "ask_and_password" -> either a manual approval or a valid password is sufficient
#                        (upstream approve-mode default/"both")
mode = "ask_and_password"
